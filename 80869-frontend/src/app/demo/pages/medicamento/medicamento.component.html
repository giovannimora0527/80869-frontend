<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">
          <i class="fa fa-pills"></i>
          &nbsp;Gestión de Medicamentos
        </h3>
        <button class="btn btn-outline-primary" (click)="abrirNuevoMedicamento()">
          <i class="fa fa-plus"></i> Nuevo Medicamento
        </button>
      </div>
    </div>
    <div class="card-body">
      <!-- Barra de búsqueda flotante y moderna para medicamentos (igual que pacientes) -->
      <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8">
          <div style="background: #fff; border-radius: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 1rem;">
            <i class="fa fa-pills fa-lg text-primary"></i>
            <input type="text" class="form-control border-0 shadow-none" style="background: transparent; font-size: 1.1rem;" placeholder="Buscar por medicamento..." [(ngModel)]="busquedaMedicamento" (input)="buscarMedicamentos()" name="busquedaMedicamento">
            <button type="button" class="btn btn-outline-secondary rounded-pill px-3" (click)="limpiarBusqueda()">
              <i class="fa fa-times"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- Aquí iría la tabla de medicamentos -->
      <div class="table-responsive">
        <!-- ... -->
      </div>
    </div>
  </div>
</div>
