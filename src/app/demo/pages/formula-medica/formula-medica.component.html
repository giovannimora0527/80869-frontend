<div class="card">
	<div class="card-body">
		<div class="d-flex justify-content-between mb-3">
			<h5>Fórmulas médicas</h5>
			<button class="btn btn-primary" (click)="abrirCrear()">Crear</button>
		</div>
		<table class="table table-striped">
			<thead>
				<tr><th>ID</th><th>Paciente</th><th>Médico</th><th>Fecha</th><th>Acciones</th></tr>
			</thead>
			<tbody>
						<tr *ngFor="let f of lista">
							<td>{{ f.id }}</td>
							<td>{{ f.pacienteId }}</td>
							<td>{{ f.medicoId }}</td>
							<td>{{ f.fecha }}</td>
							<td><button class="btn btn-sm btn-secondary" (click)="editar(f)">Editar</button></td>
						</tr>
			</tbody>
		</table>
	</div>
</div>

<!-- modal -->
<div class="modal fade" id="modalFormulaMedica" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header"><h5 class="modal-title">{{ titleModal }}</h5><button type="button" class="btn-close" (click)="closeModal()"></button></div>
			<div class="modal-body">
				<form [formGroup]="form">
					<div class="mb-3">
						<label class="form-label">Paciente ID</label>
						<input type="number" formControlName="pacienteId" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Médico ID</label>
						<input type="number" formControlName="medicoId" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Fecha</label>
						<input type="date" formControlName="fecha" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Detalles</label>
						<textarea formControlName="detalles" class="form-control"></textarea>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
				<button class="btn btn-primary" (click)="guardar()">{{ titleBoton }}</button>
			</div>
		</div>
	</div>
</div>

<p>formula-medica works!</p>
