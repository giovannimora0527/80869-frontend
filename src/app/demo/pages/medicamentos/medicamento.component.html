<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="row">
        <div class="col d-flex align-items-center justify-content-between">
          <h3 class="mb-0">
            <i class="fa fa-pills"></i>
            Medicamentos
          </h3>
          <button class="btn btn-outline-primary ms-3" (click)="abrirMedicamentoModal()">Agregar Medicamento</button>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Presentación</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody *ngIf="medicamentoList.length > 0">
            <tr *ngFor="let medicamento of medicamentoList">
              <td>{{ medicamento.id }}</td>
              <td>{{ medicamento.nombre }}</td>
              <td>{{ medicamento.descripcion }}</td>
              <td>{{ medicamento.presentacion }}</td>
              <td>
                <button class="btn btn-outline-primary btn-sm" (click)="editarModalMedicamento(medicamento)">
                  <i class="fa fa-edit"></i>&nbsp;Editar
                </button>
              </td>
            </tr>
          </tbody>
          <tbody *ngIf="medicamentoList.length === 0">
            <tr>
              <td colspan="5" class="text-center">No hay medicamentos disponibles.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalCrearMedicamento" tabindex="-1" aria-labelledby="modalCrearMedicamentoLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearMedicamentoLabel">{{ titleModal }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <div class="row">
          <div class="col">
            <form [formGroup]="form">

              <!-- Nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  formControlName="nombre"
                  class="form-control"
                  id="nombre"
                  placeholder="Ingrese el nombre del medicamento"
                />
                <div *ngIf="form.get('nombre')?.hasError('required') && form.get('nombre')?.touched" class="text-danger">
                  El nombre es requerido.
                </div>
              </div>

              <!-- Descripción -->
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea
                  formControlName="descripcion"
                  class="form-control"
                  id="descripcion"
                  placeholder="Ingrese una descripción del medicamento"
                ></textarea>
              </div>

              <!-- Presentación -->
              <div class="mb-3">
                <label for="presentacion" class="form-label">Presentación</label>
                <input
                  type="text"
                  formControlName="presentacion"
                  class="form-control"
                  id="presentacion"
                  placeholder="Ejemplo: Tabletas, Jarabe, Inyectable"
                />
              </div>

              <!-- Concentración -->
              <div class="mb-3">
                <label for="concentracion" class="form-label">Concentración</label>
                <input
                  type="text"
                  formControlName="concentracion"
                  class="form-control"
                  id="concentracion"
                  placeholder="Ejemplo: 500 mg, 10 ml, 1%"
                />
              </div>

              <!-- Stock -->
              <div class="mb-3">
                <label for="stock" class="form-label">Stock disponible</label>
                <input
                  type="number"
                  formControlName="stock"
                  class="form-control"
                  id="stock"
                  placeholder="Ingrese la cantidad disponible"
                />
              </div>

              <!-- Precio -->
              <div class="mb-3">
                <label for="precio" class="form-label">Precio (COP)</label>
                <input
                  type="number"
                  formControlName="precio"
                  class="form-control"
                  id="precio"
                  placeholder="Ingrese el precio del medicamento"
                />
              </div>

            </form>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarMedicamento()">{{ titleBoton }}</button>
      </div>
    </div>
  </div>
</div>
