<div class="container">
  <!-- Content here -->
  <div class="card">
    <div class="card-header">
      <h3>
        <i class="fa fa-users"></i>
        Mis usuarios
      </h3>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Username</th>
              <th>Rol</th>
              <th>Fecha de creación</th>
              <th>Activo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody *ngIf="usuarioList.length > 0">
            <tr *ngFor="let usuario of usuarioList">
              <td>{{ usuario.id }}</td>
              <td>{{ usuario.username }}</td>
              <td>{{ usuario.rol }}</td>
              <td>{{ usuario.fechaCreacion }}</td>
              <td>{{ usuario.activo === true? "Activo": "Inactivo" }}</td>
              <td><button class="btn btn-outline-primary" (click)="probarBoton(usuario)"><i class="fa fa-edit"></i>&nbsp;Editar</button></td>
            </tr>
          </tbody>
          <tbody *ngIf="usuarioList.length === 0">
            <tr>
              <td colspan="5" class="text-center">No hay usuarios disponibles.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
