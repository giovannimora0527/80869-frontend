<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="row">
        <div class="col d-flex">
          <h3 class="mb-0">
            <i class="fa fa-users"></i>
            Historial Medico
          </h3>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <td>Id</td>
              <td>Nombre</td>
              <td>Fecha y hora</td>
              <td>Descripción</td>
              <td>Medico</td>
              <td>Especialidad</td>
              <td>Formula</td>
            </tr>
          </thead>
           <tbody *ngIf="historialList.length > 0">
            <tr *ngFor="let historial of historialList">
                <td>{{ historial.id }}</td>
                <td>{{ historial.fechaHora | date:'dd/MM/yyyy' }}</td>
                <td>{{ historial.descripcion }}</td>
                <td>{{ historial.medicos }}</td>
                <td>{{ historial.especialidades }}</td>
                <td>{{ historial.formulas }}</td>
                <td>
                    <button class="btn btn-outline-primary" (click)="probarBoton(historial)">
                    <i class="fa fa-edit"></i>
                    &nbsp;Editar
                    </button>
                </td>
            </tr>
    
           </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
